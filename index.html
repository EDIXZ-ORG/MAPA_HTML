<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Mapa de imagen</title>
        <link rel = "stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <h1>Mapas</h1>
        </header>
        <main>
            <div>
                <table>
                    <tr>
                        <td><h1>Elige un personaje</h1></td>
                    </tr>
                    <tr>
                        <td>
                        <img src="imagenes/elenco.jpg" alt="Elenco de backyardigans" usemap="#mapa">
                        <map name="mapa">
                        <area shape="CIRCLE" coords="969, 490, 120" href="#Pablo">
                        <area shape="CIRCLE" coords="1150, 195, 150" href="#Austin">
                        <area shape="CIRCLE" coords="760, 210, 150" href="#Tasha">
                        <area shape="CIRCLE" coords="1300, 670, 170" href="#Tayron">
                        <area shape="CIRCLE" coords="640, 630, 150" href="#Uniqua">
                        </map>
                        </td>
                    </tr>
                    <tr>
                        <th><h1 id="Pablo">Pablo</h1></th>
                    </tr>                   
                    <td>
                        <img src="imagenes/pablo.jpg" alt="Pablo"> 
                    </td>
                    <tr>
                        <th><h1 id="Austin">austin</h1></th>
                    </tr>
                    <td>
                        <img src="imagenes/austin.jpg" alt="Austin"> 
                    </td>
                    <tr>
                        <th><h1 id="Tasha">Tasha</h1></th>
                    </tr>
                    <td>
                        <img src="imagenes/tasha.jpg" alt="Tasha"> 
                    </td>
                    <tr>
                        <th><h1 id="Tayron">Tyron</h1></th>
                    </tr>
                    <td>
                        <img src="imagenes/tayron.jpg" alt="Tyron"> 
                    </td>
                    <tr>
                        <th><h1 id="Uniqua">Uniqua</h1></th>
                    </tr>
                    <td>
                        <img src="imagenes/uniqua.jpg" alt="Uniqua"> 
                    </td>
                </table>                
            </div>
        </main>       
    </body>
</html>
